[package]
name = "trae-usage-monitor"
version = "0.1.0"
edition = "2021"
description = "Fetch Trae Enterprise per-user usage details, build an interactive Feishu chart card, and push it to a group or individual."

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.9"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "trae-usage-monitor"
path = "src/main.rs"
